name: API Contract CI
on:
  pull_request:
    branches: [develop, main]
    paths: ['contracts/**', 'mobile/src/types/**', 'admin/src/types/**']
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version-file: '.nvmrc', cache: npm, cache-dependency-path: contracts/package-lock.json }
      - run: npm ci
        working-directory: contracts
      - run: npm run api:check
        working-directory: contracts
