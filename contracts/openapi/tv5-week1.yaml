components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    Problem:
      type: object
      required:
        - type
        - title
        - status
        - detail
        - instance
        - code
        - requestId
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
        code:
          type: string
        requestId:
          type: string
    Coordinates:
      type: object
      required:
        - latitude
        - longitude
      properties:
        latitude:
          type: number
          minimum: -90
          maximum: 90
        longitude:
          type: number
          minimum: -180
          maximum: 180
    Image:
      type: object
      additionalProperties: false
      required:
        - storagePath
        - mediaType
      properties:
        storagePath:
          type: string
          minLength: 1
          description: Relative Storage object path; server must validate ownership. No
            binary/base64, secret or signed URL.
        mediaType:
          type: string
          enum:
            - image/jpeg
            - image/png
            - image/webp
    PostWrite:
      type: object
      additionalProperties: false
      required:
        - body
      properties:
        body:
          type: string
          minLength: 1
        destinationId:
          type:
            - string
            - "null"
          format: uuid
        media:
          type: array
          items:
            $ref: "#/components/schemas/Image"
    Post:
      type: object
      required:
        - id
        - userId
        - body
        - status
        - version
        - createdAt
        - updatedAt
        - media
      properties:
        id:
          type: string
          format: uuid
        userId:
          type: string
          format: uuid
        body:
          type: string
        destinationId:
          type:
            - string
            - "null"
          format: uuid
        status:
          type: string
          enum:
            - PENDING
            - VISIBLE
            - HIDDEN
        version:
          type: integer
          format: int64
          minimum: 0
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        media:
          type: array
          items:
            $ref: "#/components/schemas/Image"
    CommentWrite:
      type: object
      additionalProperties: false
      required:
        - body
      properties:
        body:
          type: string
          minLength: 1
    Comment:
      type: object
      required:
        - id
        - postId
        - userId
        - body
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
          format: uuid
        postId:
          type: string
          format: uuid
        userId:
          type: string
          format: uuid
        body:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    CheckInWrite:
      allOf:
        - $ref: "#/components/schemas/Coordinates"
        - type: object
          properties:
            itineraryItemId:
              type:
                - string
                - "null"
              format: uuid
              description: Must belong to this trip; validate through TV3 public interface.
    CheckIn:
      allOf:
        - $ref: "#/components/schemas/CheckInWrite"
        - type: object
          required:
            - id
            - tripId
            - userId
            - checkedInAt
          properties:
            id:
              type: string
              format: uuid
            tripId:
              type: string
              format: uuid
            userId:
              type: string
              format: uuid
            checkedInAt:
              type: string
              format: date-time
    MeetupWrite:
      allOf:
        - $ref: "#/components/schemas/Coordinates"
        - type: object
          required:
            - label
          properties:
            label:
              type: string
              minLength: 1
              maxLength: 200
            description:
              type:
                - string
                - "null"
            targetTime:
              type:
                - string
                - "null"
              format: date-time
    Meetup:
      allOf:
        - $ref: "#/components/schemas/MeetupWrite"
        - type: object
          required:
            - id
            - tripId
            - createdBy
            - createdAt
            - updatedAt
          properties:
            id:
              type: string
              format: uuid
            tripId:
              type: string
              format: uuid
            createdBy:
              type: string
              format: uuid
            createdAt:
              type: string
              format: date-time
            updatedAt:
              type: string
              format: date-time
    ShareStart:
      allOf:
        - $ref: "#/components/schemas/Coordinates"
        - type: object
          required:
            - consent
            - expiresAt
          properties:
            consent:
              type: boolean
              const: true
            expiresAt:
              type: string
              format: date-time
              description: Must be in the future. Maximum duration pending team agreement; no
                implicit default.
    ShareUpdate:
      allOf:
        - $ref: "#/components/schemas/Coordinates"
        - type: object
          required:
            - sessionStartedAt
          properties:
            sessionStartedAt:
              type: string
              format: date-time
              description: Compare to current started_at to reject queued updates from an old
                session.
    Share:
      allOf:
        - $ref: "#/components/schemas/Coordinates"
        - type: object
          required:
            - id
            - tripId
            - userId
            - startedAt
            - expiresAt
            - lastUpdatedAt
          properties:
            id:
              type: string
              format: uuid
            tripId:
              type: string
              format: uuid
            userId:
              type: string
              format: uuid
            startedAt:
              type: string
              format: date-time
            expiresAt:
              type: string
              format: date-time
            lastUpdatedAt:
              type: string
              format: date-time
    MapDestination:
      allOf:
        - $ref: "#/components/schemas/Coordinates"
        - type: object
          required:
            - id
            - name
          properties:
            id:
              type: string
              format: uuid
            name:
              type: string
