openapi: 3.1.0
info:
  title: VISTA TV5 Week 1 draft
  version: 0.1.0
  description: Proposed only; no TV5 endpoints implemented. Included by main
    contract. See docs/api/tv5-week1.md.
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary
servers:
  - url: http://localhost:8080/api/v1
tags:
  - name: TV5 Map
    description: Draft map reads
  - name: TV5 Community
    description: Draft community operations
  - name: TV5 Safety
    description: Draft private trip operations
paths:
  /map/destinations:
    get:
      tags:
        - TV5 Map
      operationId: tv5ListMapDestinations
      summary: Published destinations with coordinates
      description: "DRAFT W1: proposed contract for subsequent weeks; endpoint is not
        implemented."
      x-status: draft
      security: []
      responses:
        "200":
          description: Proposed response
          content:
            application/json:
              schema:
                type: object
                required:
                  - items
                  - page
                  - size
                  - total
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/MapDestination"
                  page:
                    type: integer
                  size:
                    type: integer
                  total:
                    type: integer
                    format: int64
        "400":
          description: RFC 9457 problem; code identifies validation, access, not found or
            conflict
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "404":
          description: RFC 9457 problem; code identifies validation, access, not found or
            conflict
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
      parameters:
        - name: minLatitude
          in: query
          required: true
          schema:
            type: number
            minimum: -90
            maximum: 90
        - name: maxLatitude
          in: query
          required: true
          schema:
            type: number
            minimum: -90
            maximum: 90
        - name: minLongitude
          in: query
          required: true
          schema:
            type: number
            minimum: -180
            maximum: 180
        - name: maxLongitude
          in: query
          required: true
          schema:
            type: number
            minimum: -180
            maximum: 180
        - name: page
          in: query
          schema:
            type: integer
            minimum: 0
            default: 0
        - name: size
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
