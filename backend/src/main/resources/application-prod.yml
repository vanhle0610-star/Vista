spring:
  config:
    activate:
      on-profile: prod
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
management:
  endpoint:
    health:
      show-details: never
vista:
  jwt:
    # Bắt buộc biến môi trường JWT_SECRET trong môi trường triển khai thực tế (tối thiểu 256 bits / 32 bytes)
    secret: ${JWT_SECRET}