spring:
  main:
    allow-bean-definition-overriding: true
  application:
    name: vista-backend
  profiles:
    default: demo
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/vista}
    username: ${DB_USERNAME:vista}
    password: ${DB_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: ${FLYWAY_LOCATIONS:classpath:db/migration}
    validate-migration-naming: true
    out-of-order: true
  mvc:
    problemdetails:
      enabled: true
server:
  port: ${SERVER_PORT:8081}
  error:
    include-message: never
    include-stacktrace: never
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true
springdoc:
  swagger-ui:
    path: /swagger-ui.html
vista:
  ai:
    api-key: ${GEMINI_API_KEY:}
    model: ${GEMINI_MODEL:gemini-2.5-flash}
    timeout: ${AI_TIMEOUT:60s}
    max-retries: ${AI_MAX_RETRIES:1}
    local-base-url: ${AI_LOCAL_BASE_URL:http://localhost:11434/v1}
    local-model: ${AI_LOCAL_MODEL:qwen3:4b}
    local-api-key: ${AI_LOCAL_API_KEY:}
    claude-api-key: ${CLAUDE_API_KEY:}
    claude-model: ${CLAUDE_MODEL:claude-3-5-sonnet-20241022}
    fallback-mode: ${AI_FALLBACK_MODE:LOCAL_ONLY}
    temperature: ${AI_TEMPERATURE:0.2}
    max-output-tokens: ${AI_MAX_OUTPUT_TOKENS:1200}
    rag:
      enabled: ${AI_RAG_ENABLED:false}
      embedding-base-url: ${AI_EMBEDDING_BASE_URL:http://localhost:11434}
      embedding-model: ${AI_EMBEDDING_MODEL:bge-m3}
      embedding-version: ${AI_EMBEDDING_VERSION:bge-m3-v1}
      embedding-timeout: ${AI_EMBEDDING_TIMEOUT:30s}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:8081,http://localhost:8082,http://127.0.0.1:8082}
  app:
    base-url: ${APP_BASE_URL:http://localhost:3000}
  auth:
    google:
      client-id: ${GOOGLE_CLIENT_ID:}
  jwt:
    secret: ${JWT_SECRET:vista-local-dev-super-secure-key-2026-minimum-256-bits-random!}
    access-token-expiration-ms: ${JWT_ACCESS_EXPIRATION_MS:900000}
    refresh-token-expiration-ms: ${JWT_REFRESH_EXPIRATION_MS:604800000}
logging:
  pattern:
    console: '%d{yyyy-MM-dd''T''HH:mm:ss.SSSXXX} level=%level requestId=%X{requestId:-none} logger=%logger{36} msg="%replace(%msg){''(?i)(password|token|secret)=\\S+'',''$1=[REDACTED]''}%n'
