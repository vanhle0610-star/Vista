# Fix OOM: move Java heap above 4GB so native heap can grow freely (CompressedOops issue)
org.gradle.jvmargs=-Xms128m -Xmx384m -XX:MaxMetaspaceSize=256m -XX:+UseG1GC -XX:HeapBaseMinAddress=4g -XX:ReservedCodeCacheSize=64m
# Use current JVM (Java 25) instead of downloading Java 21 toolchain
# build.gradle checks this property: if useCurrentJvm=true, it skips toolchain
useCurrentJvm=true
# Daemon settings
org.gradle.daemon=true
org.gradle.parallel=false
